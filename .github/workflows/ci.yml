name: CI

# Tests on every push and pull request; the release workflow runs this same file before it builds.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      pyfreerdpnative-tag:
        description: PyFreeRdpNative release to test against (empty = latest).
        type: string
        default: ""
      called:
        description: Set by callers (github.event_name is the caller's event inside a called workflow).
        type: boolean
        default: true

permissions:
  contents: read

# A new push cancels the previous CI run of that branch; a run inside a release is never cancelled.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.called && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen  # The Qt widget tests run without a display.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: System libraries for Qt (offscreen)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - uses: ./.github/actions/install-pyfreerdpnative
        with:
          tag: ${{ inputs.pyfreerdpnative-tag || vars.PYFREERDPNATIVE_TAG || '' }}

      - name: Install PyFreeRdpApp and the test tools
        run: python -m pip install --disable-pip-version-check -e ".[qt,pillow]" pytest PyQt5

      - name: Tests
        run: python -m pytest -q tests

  smoke:
    name: Import and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/install-pyfreerdpnative
        with:
          tag: ${{ inputs.pyfreerdpnative-tag || vars.PYFREERDPNATIVE_TAG || '' }}

      - name: Install PyFreeRdpApp
        run: python -m pip install --disable-pip-version-check .

      - name: Import and run the command line
        shell: bash
        working-directory: ${{ runner.temp }}  # The installed package, not the checkout.
        run: |
          python -c "import PyFreeRdpApp, PyFreeRdpApp._serverinfo as s; print('import ok', PyFreeRdpApp.__version__, s.parseUsername('DOM\\\\user'))"
          pyfreerdpapp --help > /dev/null
          python -m PyFreeRdpApp --help > /dev/null
          echo "command line ok"
